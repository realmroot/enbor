name: Enbor SDK release

on:
  push:
    tags:
      - "enbor-sdk-v*"
  workflow_dispatch:
    inputs:
      version:
        description: Existing SDK version to publish to PyPI
        required: true
        default: "0.1.0"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/enbor-sdk
    env:
      RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 10.30.2
          run_install: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
          scope: "@realmroot"

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: sdk/go/go.sum

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - run: pnpm install --frozen-lockfile

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#enbor-sdk-v}"
          VERSION="$version" node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'

          const version = process.env.VERSION
          const npmPackage = JSON.parse(readFileSync('sdk/typescript/package.json', 'utf8'))
          const pythonProject = readFileSync('sdk/python/pyproject.toml', 'utf8')
          const pythonVersion = pythonProject.match(/^version = "([^"]+)"$/m)?.[1]
          if (!version || npmPackage.version !== version || pythonVersion !== version) {
            throw new Error(`Tag, TypeScript, and Python versions must match: tag=${version}, typescript=${npmPackage.version}, python=${pythonVersion}`)
          }
          NODE

      - name: Build SDK artifacts
        run: |
          mkdir -p "$GITHUB_WORKSPACE/sdk/release-artifacts/typescript"
          pnpm --filter @realmroot/enbor-sdk run build
          pnpm --filter @realmroot/enbor-sdk pack --pack-destination "$GITHUB_WORKSPACE/sdk/release-artifacts/typescript"
          uv build sdk/python
          (cd sdk/go && go test ./...)
        working-directory: .

      - name: Publish TypeScript SDK to npm
        if: github.event_name == 'push'
        run: pnpm --filter @realmroot/enbor-sdk publish --no-git-checks --access public

      - name: Publish Python SDK to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: sdk/python/dist/

      - name: Publish Go module tag
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#enbor-sdk-v}"
          go_tag="sdk/go/v${version}"
          if git ls-remote --exit-code --tags origin "refs/tags/${go_tag}" >/dev/null 2>&1; then
            echo "${go_tag} already exists"
            exit 0
          fi
          git tag "$go_tag" "$GITHUB_SHA"
          git push origin "$go_tag"

      - name: Publish GitHub release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            sdk/openapi.json \
            sdk/release-artifacts/typescript/*.tgz \
            --title "Enbor SDK v${GITHUB_REF_NAME#enbor-sdk-v}" \
            --generate-notes
