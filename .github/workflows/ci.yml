name: CI
run-name: ${{ github.event_name == 'schedule' && 'Nightly full CI' || github.event_name == 'workflow_dispatch' && 'Manual full CI' || github.event.pull_request.title || github.event.head_commit.message || github.ref_name }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
  schedule:
    # Full default-branch verification away from GitHub's top-of-hour load spike.
    - cron: '17 5 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify Changes
    runs-on: ubuntu-latest
    outputs:
      quality: ${{ steps.classify.outputs.quality }}
      application: ${{ steps.classify.outputs.application }}
      integration: ${{ steps.classify.outputs.integration }}
      e2e: ${{ steps.classify.outputs.e2e }}
      build: ${{ steps.classify.outputs.build }}
      runner: ${{ steps.classify.outputs.runner }}
      runtime: ${{ steps.classify.outputs.runtime }}
      packaging: ${{ steps.classify.outputs.packaging }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Verify change classification
        run: node --test scripts/classify-ci-changes.test.mjs
      - name: Classify changed paths
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          changed_files="$RUNNER_TEMP/changed-files.txt"

          case "$EVENT_NAME" in
            schedule|workflow_dispatch)
              node scripts/classify-ci-changes.mjs --full >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            pull_request)
              git diff --name-only "$PR_BASE_SHA...$PR_HEAD_SHA" > "$changed_files"
              ;;
            merge_group)
              git diff --name-only "$MERGE_BASE_SHA..$MERGE_HEAD_SHA" > "$changed_files"
              ;;
            push)
              if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
                git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" > "$changed_files"
              else
                git diff --name-only "$BEFORE_SHA..$GITHUB_SHA" > "$changed_files"
              fi
              ;;
            *)
              echo "unsupported CI event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac

          sort -u -o "$changed_files" "$changed_files"
          echo "Changed paths:"
          sed 's/^/  /' "$changed_files"
          node scripts/classify-ci-changes.mjs "$changed_files" | tee -a "$GITHUB_OUTPUT"

  lint:
    name: Lint and Typecheck
    needs: changes
    if: needs.changes.outputs.quality == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 10.30.2
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check embedded runtime bridge bundle
        run: |
          pnpm run bridge:build
          git diff --exit-code -- cmd/enbor-runner/pkg/runtimebridge/bundle.mjs
      - run: pnpm run lint
      - run: pnpm run lint:arch
      - run: pnpm run lint:spec
      - run: pnpm run lint:escapes
      - run: pnpm run lint:types
      - run: pnpm run typecheck
      - run: pnpm --filter @realmroot/enbor-sdk run typecheck

  application:
    name: Unit, Web, and Contracts
    needs: changes
    if: needs.changes.outputs.application == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 10.30.2
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: |
            cmd/enbor-runner/go.sum
            sdk/go/go.sum
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: pnpm install --frozen-lockfile
      - run: go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.7.1
      - run: uv tool install openapi-python-client==0.29.0
      - run: echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: pnpm run contract:check
      # sdk-layout.test.ts owns OpenAPI/SDK drift verification inside this suite.
      - run: pnpm run test:coverage

  integration:
    name: Workerd Integration
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 10.30.2
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run --project integration

  e2e:
    name: Playwright E2E
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 10.30.2
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run e2e

  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 10.30.2
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

  enbor-runner-coverage:
    name: Enbor Runner Coverage
    needs: changes
    if: needs.changes.outputs.runner == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: cmd/enbor-runner/go.sum
      - name: Check Enbor Runner coverage and races
        working-directory: cmd/enbor-runner
        run: |
          go test -race ./... -coverprofile=/tmp/enbor-runner.cover
          python3 - <<'PY'
          import re
          import subprocess
          import sys

          ignored = ("protocol_gen.go", "session_events_gen.go", "/cmd/enbor-runner/main.go")
          with open("/tmp/enbor-runner.cover") as source, open("/tmp/enbor-runner.filtered.cover", "w") as target:
              target.write(next(source))
              for line in source:
                  if not any(name in line for name in ignored):
                      target.write(line)

          result = subprocess.run(
              ["go", "tool", "cover", "-func=/tmp/enbor-runner.filtered.cover"],
              check=True,
              capture_output=True,
              text=True,
          )
          print(result.stdout)
          match = re.search(r"total:\s+\(statements\)\s+([0-9.]+)%", result.stdout)
          if not match:
              print("failed to parse Enbor Runner coverage total", file=sys.stderr)
              sys.exit(1)
          coverage = float(match.group(1))
          if coverage < 90.0:
              print(f"Enbor Runner coverage {coverage:.1f}% is below 90.0%", file=sys.stderr)
              sys.exit(1)
          PY

  enbor-runner-platforms:
    name: Enbor Runner (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.runner == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: cmd/enbor-runner/go.sum
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Run macOS Enbor Runner tests
        if: runner.os == 'macOS'
        working-directory: cmd/enbor-runner
        run: go test -race ./...
      - name: Run Windows Enbor Runner tests
        if: runner.os == 'Windows'
        working-directory: cmd/enbor-runner
        run: go test ./...
      - name: Smoke macOS Enbor Runner binary
        if: runner.os == 'macOS'
        working-directory: cmd/enbor-runner
        shell: bash
        run: |
          go build -o "$RUNNER_TEMP/enbor-runner" .
          "$RUNNER_TEMP/enbor-runner" version --json
      - name: Smoke Windows Enbor Runner binary
        if: runner.os == 'Windows'
        working-directory: cmd/enbor-runner
        shell: pwsh
        run: |
          go build -o "$env:RUNNER_TEMP/enbor-runner.exe" .
          & "$env:RUNNER_TEMP/enbor-runner.exe" version --json

  runtime-platforms:
    name: Runtime Bridge (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 10.30.2
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run packages/runtime-bridge/src/host/cli.platform.test.ts
      - name: Smoke runtime bridge
        if: runner.os == 'Linux'
        run: pnpm run smoke:mock

  enbor-runner-packaging:
    name: Enbor Runner Packaging
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: cmd/enbor-runner/go.sum
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: v2.18.0
          install-only: true
      - name: Validate GoReleaser configuration
        run: goreleaser check
      - name: Compile-check Windows arm64
        working-directory: cmd/enbor-runner
        run: CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -o /tmp/enbor-runner-windows-arm64.exe .
      - name: Build and verify release archives
        shell: bash
        run: |
          set -euo pipefail
          goreleaser release --snapshot --clean
          linux_amd64_archive="$(find dist -maxdepth 1 -type f -name 'enbor-runner_*_linux_amd64.tar.gz' -print -quit)"
          linux_arm64_archive="$(find dist -maxdepth 1 -type f -name 'enbor-runner_*_linux_arm64.tar.gz' -print -quit)"
          windows_archive="$(find dist -maxdepth 1 -type f -name 'enbor-runner_*_windows_amd64.zip' -print -quit)"
          test -n "$linux_amd64_archive"
          test -n "$linux_arm64_archive"
          test -n "$windows_archive"
          tar -tzf "$linux_amd64_archive" | grep -Fxq enbor-runner
          tar -tzf "$linux_arm64_archive" | grep -Fxq enbor-runner
          unzip -Z1 "$windows_archive" | grep -Fxq enbor-runner.exe
          grep -Eq '^[0-9a-f]{64}  enbor-runner_.*_linux_amd64.tar.gz$' dist/checksums.txt
          grep -Eq '^[0-9a-f]{64}  enbor-runner_.*_linux_arm64.tar.gz$' dist/checksums.txt
      - name: Build and smoke-test the Runner image
        shell: bash
        run: |
          set -euo pipefail
          context="$RUNNER_TEMP/enbor-runner-image"
          mkdir -p "$context/linux/amd64" "$context/linux/arm64"
          linux_amd64_archive="$(find dist -maxdepth 1 -type f -name 'enbor-runner_*_linux_amd64.tar.gz' -print -quit)"
          linux_arm64_archive="$(find dist -maxdepth 1 -type f -name 'enbor-runner_*_linux_arm64.tar.gz' -print -quit)"
          tar -xzf "$linux_amd64_archive" -C "$context/linux/amd64" enbor-runner
          tar -xzf "$linux_arm64_archive" -C "$context/linux/arm64" enbor-runner
          for platform in amd64 arm64; do
            docker buildx build \
              --platform "linux/$platform" \
              --load \
              --tag "enbor-runner:ci-$platform" \
              --file cmd/enbor-runner/Dockerfile.runner \
              "$context"
            docker run --rm --platform "linux/$platform" "enbor-runner:ci-$platform" version --json | grep -Fq '"name":"enbor-runner"'
          done
          credential_dir="$RUNNER_TEMP/enbor-config"
          state_dir="$RUNNER_TEMP/enbor-state"
          workspace_dir="$RUNNER_TEMP/enbor-workspace"
          mkdir -p "$credential_dir" "$state_dir" "$workspace_dir"
          printf '{}\n' > "$credential_dir/credentials.json"
          chmod 600 "$credential_dir/credentials.json"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --entrypoint sh \
            --volume "$credential_dir:/enbor/config" \
            --volume "$state_dir:/enbor/state" \
            --volume "$workspace_dir:/workspace" \
            enbor-runner:ci-amd64 \
            -c 'test -r /enbor/config/credentials.json && touch /enbor/state/probe /workspace/probe'
          auth_status="$(docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --env ENBOR_RUNNER_CREDENTIALS=/enbor/config/credentials.json \
            --volume "$credential_dir:/enbor/config" \
            enbor-runner:ci-amd64 auth status 2>&1 || true)"
          grep -Fq 'not logged in' <<<"$auth_status"

  ci-required:
    name: CI Required
    needs:
      - changes
      - lint
      - application
      - integration
      - e2e
      - build
      - enbor-runner-coverage
      - enbor-runner-platforms
      - runtime-platforms
      - enbor-runner-packaging
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify selected jobs
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<<"$JOB_RESULTS"
