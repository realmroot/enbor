name: Enbor Runner release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: cmd/enbor-runner/go.mod
          cache-dependency-path: cmd/enbor-runner/go.sum

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: v2.18.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify-public-container:
    name: Verify public container
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Verify the public container
        run: |
          set -euo pipefail
          image_version="${GITHUB_REF_NAME#v}"
          docker pull "ghcr.io/realmroot/enbor-runner:${image_version}"
          docker run --rm "ghcr.io/realmroot/enbor-runner:${image_version}" version --json | grep -Fq '"name":"enbor-runner"'
